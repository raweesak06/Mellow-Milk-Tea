<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="250" cy="250" r="220" fill="#FFE142" stroke="#222222" stroke-width="12" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="#222222" stroke-width="4" stroke-dasharray="10 10" />

  <!-- Tail (Behind Body) -->
  <path d="M 140 350 C 90 360 60 300 80 260 C 90 280 120 310 150 310" fill="#4B9B42" stroke="#222222" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tail Spikes -->
  <path d="M 75 285 L 65 275 L 82 270" fill="#2E6B28" stroke="#222222" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 90 310 L 80 300 L 98 293" fill="#2E6B28" stroke="#222222" stroke-width="6" stroke-linejoin="round"/>

  <!-- Body & Shirt -->
  <path d="M 160 330 C 160 250 340 250 340 330 C 340 400 160 400 160 330 Z" fill="#FF5722" stroke="#222222" stroke-width="8" stroke-linejoin="round"/>
  <!-- Hawaiian Shirt Pattern (Leaves) -->
  <path d="M 200 310 Q 210 290 220 310 Q 210 330 200 310 Z" fill="#FFE142" />
  <path d="M 280 330 Q 290 310 300 330 Q 290 350 280 330 Z" fill="#FFE142" />
  <path d="M 230 360 Q 240 340 250 360 Q 240 380 230 360 Z" fill="#FFE142" />

  <!-- Left Arm (Holding Watermelon Slice) -->
  <path d="M 170 310 Q 120 330 110 360 Q 130 380 160 350" fill="#4B9B42" stroke="#222222" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Watermelon Slice -->
  <g transform="translate(70, 320) rotate(-20)">
    <path d="M 10 50 Q 50 90 90 50 Z" fill="#FF2A4B" stroke="#222222" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 10 50 Q 50 90 90 50" fill="none" stroke="#259B3A" stroke-width="14" stroke-linecap="round"/>
    <path d="M 10 50 Q 50 90 90 50" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <!-- Seeds -->
    <circle cx="35" cy="55" r="3" fill="#222"/>
    <circle cx="50" cy="65" r="3" fill="#222"/>
    <circle cx="65" cy="55" r="3" fill="#222"/>
  </g>

  <!-- Right Arm (Thumbs Up) -->
  <!-- Upper Arm -->
  <path d="M 320 310 Q 370 300 380 270" fill="none" stroke="#4B9B42" stroke-width="32" stroke-linecap="round"/>
  <path d="M 320 310 Q 370 300 380 270" fill="none" stroke="#222222" stroke-width="40" stroke-linecap="round" style="mix-blend-mode: destination-over;"/> <!-- Outline trick -->
  <!-- Hand & Thumbs Up -->
  <g transform="translate(360, 210)">
    <!-- Fist -->
    <circle cx="25" cy="45" r="16" fill="#4B9B42" stroke="#222222" stroke-width="7"/>
    <!-- Thumb Up -->
    <path d="M 20 45 C 10 40 10 10 25 10 C 38 10 35 35 35 45 Z" fill="#4B9B42" stroke="#222222" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Head Base -->
  <path d="M 160 220 C 160 140 340 140 340 220 C 340 260 300 270 250 270 C 200 270 160 260 160 220 Z" fill="#4B9B42" stroke="#222222" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Snout / Mouth (Cheeky Smirk) -->
  <path d="M 170 210 Q 250 190 330 210 C 350 240 320 265 250 265 C 180 265 150 240 170 210 Z" fill="#6ECB63" stroke="#222222" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Smirk Line & Sharp Tooth -->
  <path d="M 180 230 Q 250 255 325 225" fill="none" stroke="#222222" stroke-width="7" stroke-linecap="round"/>
  <!-- Sharp Teeth sticking out -->
  <polygon points="290,237 300,250 308,234" fill="#FFFFFF" stroke="#222222" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="200,232 208,245 216,234" fill="#FFFFFF" stroke="#222222" stroke-width="5" stroke-linejoin="round"/>

  <!-- Nostrils -->
  <circle cx="230" cy="205" r="4" fill="#222222"/>
  <circle cx="250" cy="203" r="4" fill="#222222"/>

  <!-- Cool Sunglasses -->
  <g filter="url(#shadow)">
    <!-- Glasses Frame -->
    <path d="M 165 170 L 245 175 L 255 175 L 335 170 L 325 205 L 255 200 L 245 200 L 175 205 Z" fill="#222222" stroke="#222222" stroke-width="6" stroke-linejoin="round"/>
    <!-- Lenses (Thug Life / Cool Glare) -->
    <path d="M 175 176 L 240 180 L 235 198 L 183 200 Z" fill="#333333"/>
    <path d="M 260 180 L 325 176 L 317 200 L 265 198 Z" fill="#333333"/>
    <!-- Lens Glare Lines -->
    <polygon points="185,180 205,180 190,198 180,198" fill="#FFFFFF" opacity="0.6"/>
    <polygon points="270,180 290,180 275,198 265,198" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Farmer Straw Hat -->
  <!-- Hat Back/Base -->
  <path d="M 130 160 Q 250 110 370 160 Q 250 135 130 160 Z" fill="#E5A93C" stroke="#222222" stroke-width="8" stroke-linejoin="round"/>
  <!-- Hat Crown -->
  <path d="M 195 145 C 195 70 305 70 305 145" fill="#F4C453" stroke="#222222" stroke-width="8" stroke-linejoin="round"/>
  <!-- Red Ribbon on Hat -->
  <path d="M 193 135 C 220 120 280 120 307 135 C 306 143 294 146 294 146 C 280 133 220 133 195 144 Z" fill="#FF2A4B" stroke="#222222" stroke-width="4"/>
  <!-- Hat Texture Details -->
  <path d="M 230 90 Q 250 100 270 90" fill="none" stroke="#D39223" stroke-width="4" stroke-linecap="round"/>
  <path d="M 220 110 Q 250 120 280 110" fill="none" stroke="#D39223" stroke-width="4" stroke-linecap="round"/>

  <!-- Decorative Fruit Elements (Floating/Vibe) -->
  <!-- Mango Top Right -->
  <g transform="translate(370, 90) rotate(15)">
    <path d="M 20 10 C 40 10 50 30 40 50 C 30 70 10 60 5 40 C 0 20 10 10 20 10 Z" fill="#FFB300" stroke="#222222" stroke-width="5"/>
    <path d="M 20 10 Q 25 0 30 2" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
